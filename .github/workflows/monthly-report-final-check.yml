name: Monthly report final branch check
on:
  push:
    branches:
      - feature/monthly-report-details
    paths:
      - .github/workflows/monthly-report-final-check.yml
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/feature/monthly-report-details'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_anonymous_fixture_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: test ! -e verification/monthly-report && test ! -e app/monthly-report-fixture
      - run: npm ci
      - run: node --test tests/monthly-report.test.mjs
      - run: npm run build
