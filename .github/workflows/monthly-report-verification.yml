name: Monthly report anonymous visual verification
on:
  push:
    branches:
      - feature/monthly-report-details
    paths:
      - .github/workflows/monthly-report-verification.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    if: github.ref == 'refs/heads/feature/monthly-report-details'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_anonymous_fixture_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-noto-cjk
      - run: node verification/monthly-report/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monthly-report-anonymous-visual
          path: verification/monthly-report/output/
          if-no-files-found: warn
          retention-days: 7
